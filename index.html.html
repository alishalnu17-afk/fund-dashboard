<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fund Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#ffffff;--text:#1b2430;--muted:#667085;--line:#e3e7ee;--accent:#2f6fed;--good:#12805c;--bad:#c2410c;--grid:rgba(0,0,0,.08)}
[data-theme=dark]{--bg:#0f141b;--card:#171e28;--text:#e8edf4;--muted:#93a0b4;--line:#2a3442;--accent:#6ea0ff;--good:#3ecf9a;--bad:#ff9d6e;--grid:rgba(255,255,255,.09)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button,.tabs button,.theme{font:inherit;color:var(--text);background:transparent;border:0;padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.theme{border:1px solid var(--line);border-radius:8px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 20px 0}
.tabs button{border-radius:8px 8px 0 0;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
main{padding:16px 20px 40px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:14px}
.grid{display:grid;gap:12px;margin-bottom:14px}
.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{margin:0}.kpi .l{color:var(--muted);font-size:12px}.kpi .v{font-size:24px;font-weight:650;margin:2px 0}.kpi .s{font-size:12px;color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}
.ch{position:relative;height:330px}.ch.tall{height:360px}
.note{color:var(--muted);font-size:12px;margin:0 0 10px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600;font-size:12px}
.hm td{text-align:center;min-width:64px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:650;color:#fff}
.b-Conservative{background:#2f8f6b}.b-Moderate{background:#c28a12}.b-Aggressive{background:#c2410c}
.form label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
.form input[type=number],.form select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.form input[type=range]{width:100%}
.q{margin-top:12px}.q b{display:block;font-size:13px;margin-bottom:3px}.q label{display:block;margin:2px 0;font-size:13px;color:var(--text)}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:14px}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.warn{border-left:3px solid var(--bad);padding:6px 10px;background:var(--bg);margin:8px 0;font-size:13px}
</style></head>
<body>

  <div class="seg" id="pseg"></div>

</header>
<div class="tabs" id="tabs"></div>
<main id="app"></main>

const clamp = (x, a = 0, b = 100) => Math.max(a, Math.min(b, x));

function scoreProfile(p) {
  const age = clamp((70 - p.age) / 45 * 90 + 10), hor = clamp((p.horizon - 1) / 14 * 100);
  const inc = p.income < 5 ? 20 : p.income < 15 ? 45 : p.income < 30 ? 65 : p.income < 75 ? 85 : 100;
  const stab = { stable: 100, variable: 55, uncertain: 20 }[p.stability];
  const capacity = 0.30 * hor + 0.25 * age + 0.25 * stab + 0.20 * inc;
  const loss = clamp((p.loss - 5) / 35 * 100), quest = (p.q.reduce((a, b) => a + b, 0) / p.q.length - 1) / 3 * 100;
  const tolerance = 0.5 * loss + 0.5 * quest;
  let overall = 0.4 * capacity + 0.6 * tolerance; const notes = [];
  if (p.horizon < 3 && overall > 35) { overall = 35; notes.push("Investment horizon is under 3 years, so the profile is capped at Conservative."); }
  const profile = overall < 40 ? "Conservative" : overall < 70 ? "Moderate" : "Aggressive";
  return { capacity, tolerance, overall, profile, notes };
}
/* score 0 -> min-variance, 55 -> max-Sharpe, 100 -> highest-return frontier point */
function pickIdx(P, score) {
  const last = P.front.length - 1, k = P.k_ms;
  const pos = score <= 55 ? score / 55 * k : k + (score - 55) / 45 * (last - k);
  return Math.round(clamp(pos, 0, last));
}

function client() {
  const p = S.p;
  $("#app").innerHTML = `<div class="split">
   <div class="card form" id="f"><h3>Client profile</h3>
    <label>Age</label><input type="number" name="age" min="18" max="80" value="${p.age}">
    <label>Annual income (Rs lakh)</label><input type="number" name="income" min="0" step="1" value="${p.income}">
    <label>Amount to invest (Rs lakh)</label><input type="number" name="amount" min="0" step="1" value="${p.amount}">
    <label>Investment horizon (years)</label><input type="number" name="horizon" min="1" max="40" value="${p.horizon}">
    <label>Largest one-year loss you could accept: <b id="lossv">${p.loss}%</b></label><input type="range" name="loss" min="5" max="50" value="${p.loss}">
    <label>Income stability</label><select name="stability"><option value="stable">Stable (salary / pension)</option><option value="variable">Variable (business / commission)</option><option value="uncertain">Uncertain</option></select>
    ${QS.map((q, i) => `<div class="q"><b>${i + 1}. ${q[0]}</b>${q[1].map((o, j) => `<label><input type="radio" name="q${i}" value="${j + 1}" ${p.q[i] === j + 1 ? "checked" : ""}> ${o}</label>`).join("")}</div>`).join("")}
   </div>
   <div id="rec"></div></div>`;
  $("#f select").value = p.stability;
  const read = () => { const f = $("#f"), g = n => f.querySelector(`[name=${n}]`);
    p.age = clamp(+g("age").value || 35, 18, 80); p.income = Math.max(0, +g("income").value || 0); p.amount = Math.max(0, +g("amount").value || 0);
    p.horizon = clamp(+g("horizon").value || 1, 1, 40); p.loss = +g("loss").value; p.stability = g("stability").value;
    p.q = [0, 1, 2, 3, 4].map(i => +f.querySelector(`input[name=q${i}]:checked`).value);
    $("#lossv").textContent = p.loss + "%"; recommend(); };
  $("#f").addEventListener("input", read); $("#f").addEventListener("change", read);
  recommend();
}

function recommend() {
  const P = D.p[S.pid], p = S.p, sc = scoreProfile(p), k = pickIdx(P, sc.overall), pt = P.front[k];
  const worst = 1.645 * pt.risk, f = Math.min(1, p.loss / 100 / worst), amt = p.amount;
  const blended = f * (pt.ret + P.rf) + (1 - f) * P.rf;
  const bar = (l, v) => `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between"><span>${l}</span><b>${v.toFixed(0)}/100</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`;
  const rows = P.tickers.map((t, i) => `<tr><td><b>${t}</b></td><td>${P.sectors[i]}</td><td>${pct(pt.w[i])}</td><td>${pct(pt.w[i] * f)}</td><td>${(amt * f * pt.w[i]).toFixed(2)}</td></tr>`).join("");
  const arche = [["Conservative", 20], ["Moderate", 55], ["Aggressive", 85]].map(([n, s]) => { const q = P.front[pickIdx(P, s)];
    return `<tr><td><span class="badge b-${n}">${n}</span></td><td>${pct(q.ret)}</td><td>${pct(q.risk)}</td><td>${num(q.sharpe)}</td><td style="white-space:normal;text-align:left">${P.tickers.map((t, i) => `${t} ${(q.w[i] * 100).toFixed(0)}%`).join(", ")}</td></tr>`; }).join("");
  const share = k <= P.k_ms ? `${(k / P.k_ms * 100).toFixed(0)}% of the way from the minimum-variance portfolio to the max-Sharpe portfolio` : `${((k - P.k_ms) / (P.front.length - 1 - P.k_ms) * 100).toFixed(0)}% of the way from the max-Sharpe portfolio to the highest-return frontier point`;
  $("#rec").innerHTML = `
  <div class="card"><h3>Risk profile</h3>
   <p><span class="badge b-${sc.profile}" style="font-size:16px">${sc.profile}</span> &nbsp; overall risk score <b>${sc.overall.toFixed(0)}</b>/100 (&lt;40 Conservative, 40-69 Moderate, 70+ Aggressive)</p>
   ${bar("Risk capacity (age, horizon, income, stability)", sc.capacity)}${bar("Risk tolerance (loss limit + questionnaire)", sc.tolerance)}
   ${sc.notes.map(n => `<div class="warn">${n}</div>`).join("")}</div>
  <div class="card"><h3>Recommended point on the ${S.pid} efficient frontier</h3>
   <p class="note">Frontier point ${k + 1} of ${P.front.length}: ${share}.</p>
   <div class="grid k6" style="margin-bottom:0">
    <div class="card kpi"><div class="l">Excess return (ann.)</div><div class="v">${pct(pt.ret)}</div></div>
    <div class="card kpi"><div class="l">Risk (ann. SD)</div><div class="v">${pct(pt.risk)}</div></div>
    <div class="card kpi"><div class="l">Sharpe</div><div class="v">${num(pt.sharpe)}</div></div>
    <div class="card kpi"><div class="l">Beta</div><div class="v">${num(pt.beta)}</div></div></div>
   <div class="ch" style="margin-top:12px"><canvas id="c_rec"></canvas></div></div>
  <div class="card"><h3>Suggested split for Rs ${amt.toFixed(1)} lakh</h3>
   <p>Stress check: a bad year (about a 1-in-20 outcome, 1.645 x risk) for this equity portfolio is a fall of roughly <b>${pct(worst, 0)}</b>; the client accepts <b>${p.loss}%</b>.
   So the equity fund is sized at <b>${pct(f, 0)}</b> and the remaining <b>${pct(1 - f, 0)}</b> goes to debt / liquid funds (risk-free proxy: 10-year G-Sec, about ${pct(P.rf)} a year).</p>
   <table><tr><th>Holding</th><th>Sector</th><th>Weight in equity fund</th><th>Weight overall</th><th>Rs lakh</th></tr>${rows}
   <tr><td><b>Debt / liquid</b></td><td>Risk-free</td><td>-</td><td>${pct(1 - f)}</td><td>${(amt * (1 - f)).toFixed(2)}</td></tr></table>
   <p class="note">Blended historical return (in-sample, not a forecast): about ${pct(blended)} a year including the risk-free rate.</p></div>
  <div class="card"><h3>Where each profile lands on this frontier</h3>
   <table><tr><th>Profile</th><th>Excess return</th><th>Risk</th><th>Sharpe</th><th style="text-align:left">Weights</th></tr>${arche}</table></div>
  <div class="warn">Academic illustration, not investment advice. Weights are optimised on 5 years of historical prices for four stocks; past returns do not predict future returns, and all four stocks are high-volatility equities. Scoring rules (weights, bands, the 1.645 x risk stress test) are simple assumptions you can change in the code.</div>`;
  drawFrontier("c_rec", P, pt);
}

/* ---------------- chrome ---------------- */
function render() {
  document.documentElement.dataset.theme = S.theme;
  Chart.defaults.color = css("--muted"); Chart.defaults.borderColor = css("--grid");
  $("#pseg").innerHTML = ORDER.map(o => `<button class="${o === S.pid ? "on" : ""}" data-p="${o}">${o}</button>`).join("");
  $("#tabs").innerHTML = TABS.map(([k, n]) => `<button class="${k === S.tab ? "on" : ""}" data-t="${k}">${n}</button>`).join("");
  ({ overview, ratios, div, stocks, client })[S.tab]();
}
$("#pseg").addEventListener("click", e => { if (e.target.dataset.p) { S.pid = e.target.dataset.p; render(); } });
$("#tabs").addEventListener("click", e => { if (e.target.dataset.t) { S.tab = e.target.dataset.t; render(); } });
$("#thm").addEventListener("click", () => { S.theme = S.theme === "dark" ? "light" : "dark"; render(); });
render();
</script></body></html>
